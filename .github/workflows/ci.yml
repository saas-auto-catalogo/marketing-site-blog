name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: saas-auto-catalogo/.github/.github/workflows/reusable-vite-ci.yml@main

  deploy:
    name: deploy-vps
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SPA over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Host ECDSA key (sshd also has ED25519/RSA). Keep in sync with `ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub` on the VPS.
          fingerprint: SHA256:Y2xt7oRzNaWivQcaxk3a9G4YuUWE0aEsuGhjcYeqR8k
          # Dial + overall client budget. Keep generous: concurrent SPA publishes on a 2-vCPU VPS can exceed 2m.
          timeout: 10m
          # Allow waiting on /var/lock/autocatalogo-publish-spas.lock when other SPAs deploy in parallel.
          command_timeout: 30m
          script: |
            set -euo pipefail
            /opt/autocatalogo/scripts/publish-spas.sh marketing-site-blog

      - name: HTTPS check
        run: |
          set -euo pipefail
          code=$(curl -fsSI -o /dev/null -w '%{http_code}' https://drivesync.me/)
          echo "http_code=$code"
          test "$code" = "200"

